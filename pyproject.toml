[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profair-observability"
version = "0.1.0"
description = "Reproducible measurement of multidimensional market observability in trade fairs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "María Dolores González Barbado"}
]
keywords = [
  "trade fairs",
  "market observability",
  "gender representation",
  "computational social science",
  "exhibitions"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10"
]

[project.scripts]
profair = "profair_observability.cli:main"

[project.urls]
Homepage = "https://github.com/missmew33/profair-observability"
Repository = "https://github.com/missmew33/profair-observability"
Issues = "https://github.com/missmew33/profair-observability/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
